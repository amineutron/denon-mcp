[project]
name = "denon-mcp"
version = "0.1.0"
description = "MCP server for Denon AVR home cinema control via telnet"
readme = "README.md"
authors = [{ name = "marouabah" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.5.0",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/marouabah/denon-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
